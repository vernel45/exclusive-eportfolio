<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samantha Verneuille</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <section id="landing-page">
      <nav>
        <figure>
          <img id="personal-logo" src="./assets/logo.png" alt="" />
        </figure>
        <ul class="nav__link--list">
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link___hover-effect link__hover-effect--black"
              >About</a
            >
          </li>
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link___hover-effect link__hover-effect--black"
              >Projects</a
            >
          </li>
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Contact</a
            >
          </li>
          <li class="nav__link click">
            <a
              href="#"
              class="nav__link--anchor link___hover-effect link__hover-effect--black"
            >
              <i class="fa-solid fa-circle-half-stroke"></i>
            </a>
          </li>
        </ul>
      </nav>
      <header class="header">
        <div class="header__content">
          <h1 class="title">Hello</h1>
          <h1 class="title purple"><span class="purple">I'm Samantha</span></h1>
          <p class="header__para">
            I'm a
            <b> <span class="purple">Frontend Software Engineer</span></b> with
            a <br />strong passion for building web <br />
            applications with great user experiences.
            <br />
            Here's a bit more <b> <span class="purple"> about me.</span></b>
          </p>
          <div class="social__list">
            <a href="https://www.linkedin.com/in/samantha-verneuille/" target="_blank" class="social__link click" aria-label="LinkedIn"
              ><i class="fa-brands fa-linkedin-in"></i
            ></a>
            <a href="https://github.com/vernel45" target="_blank" class="social__link click" aria-label="GitHub"
              ><i class="fa-brands fa-github"></i
            ></a>
            <a href="./assets/Verneuille Resume.pdf" target="_blank" class="social__link click" aria-label="Email"
              ><i class="fa-solid fa-file-pdf"></i
            ></a>
          </div>
        </div>
      </header>
      <button class="mail__btn click">
        <i class="fa-solid fa-envelope"></i>

      </div>
    </section>
  </body>
</html>
